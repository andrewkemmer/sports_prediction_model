name: backend-hygiene

# Structural gate on every push/PR that touches the MLB backend:
# every file in mlb-backend/backend must be reachable from
# master_pipeline.py (the one entry point the Kaggle daily run executes)
# or explicitly allowlisted in check_production_graph.py with a
# justification. Research code, ablations, diagnostics and test files
# are therefore uncommittable by default — they belong in the agent/user
# scratch workspace, and a verdict that matters lands as an mlb_* record
# in data_delivery/ plus a production-code change (see README.md).

on:
  push:
    branches: [main]
    paths:
      - 'mlb-backend/backend/**'
      - '.github/workflows/backend-hygiene.yml'
  pull_request:
    paths:
      - 'mlb-backend/backend/**'
      - '.github/workflows/backend-hygiene.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  production-graph-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Production-graph guard (no unowned files in backend/)
        working-directory: mlb-backend/backend
        run: python check_production_graph.py
