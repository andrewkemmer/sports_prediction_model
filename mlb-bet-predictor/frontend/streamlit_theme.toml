# Streamlit dark theme for the MLB Predictions dashboard.
#
# This file is the canonical theme definition (kept in /frontend per the spec).
# Streamlit reads themes from `.streamlit/config.toml` at the repository root —
# that file mirrors this one. If you rename/copy this file into place, the app
# picks it up on the next `streamlit run`.

[theme]
base = "dark"
primaryColor = "#10B981"          # emerald accent (picks, positives, bars)
backgroundColor = "#0A1128"       # very dark navy page background
secondaryBackgroundColor = "#1E293B"
textColor = "#E2E8F0"
font = "sans serif"
